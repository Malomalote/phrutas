<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1030">
  <title>Sandía Jelly · Fusión frutal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=14">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍉</text></svg>">
</head>
<body>
  <div id="app">

    <!-- Fondo decorativo animado (blobs CSS) -->
    <div id="bg" aria-hidden="true">
      <div class="bg-blob b1"></div>
      <div class="bg-blob b2"></div>
      <div class="bg-blob b3"></div>
      <div class="bg-grain"></div>
    </div>

    <!-- Escenario -->
    <main id="stage">
      <canvas id="game-canvas" width="720" height="1080" aria-label="Tablero de juego"></canvas>

      <!-- HUD superior -->
      <header id="hud-top">
        <section class="panel score-panel" aria-live="polite">
          <h1 class="brand"><span class="brand-main">SANDÍA</span><span class="brand-accent">JELLY</span></h1>
          <div class="score-row">
            <div class="score-block">
              <span class="label" id="label-score">Puntos</span>
              <span class="value" id="score">0</span>
            </div>
            <div class="score-block best">
              <span class="label" id="label-best">Récord</span>
              <span class="value" id="best">0</span>
            </div>
          </div>
        </section>

        <section class="panel right-panel">
          <div class="next-block">
            <span class="label" id="label-next">Siguiente</span>
            <div class="next-orb"><canvas id="next-canvas" width="128" height="128"></canvas></div>
          </div>
          <div class="hud-buttons">
            <button id="btn-sound" class="icon-btn" title="Sonido" aria-label="Activar o silenciar sonido">🔊</button>
            <button id="btn-pause" class="icon-btn" title="Pausa (P)" aria-label="Pausar">⏸</button>
          </div>
        </section>
      </header>

      <!-- Banda inferior: cadena de evolución + barra de energía -->
      <div id="bottom-ui">
        <nav id="evo-strip" class="panel" aria-label="Cadena de evolución"></nav>
        <aside id="energy-rail" class="panel">
          <button id="btn-tilt-left" class="icon-btn tilt" title="Inclinar a la izquierda">↶</button>
          <div class="energy-track" role="progressbar" aria-label="Energía" aria-valuemin="0" aria-valuemax="100">
            <div id="energy-fill"></div>
            <div class="energy-ticks"></div>
          </div>
          <button id="btn-tilt-right" class="icon-btn tilt" title="Inclinar a la derecha">↷</button>
          <span class="label vertical" id="label-energy">Energía</span>
          <button id="btn-soften" class="soften-btn" title="Amasar la gelatina (A)">
            <span class="soften-icon"> ✋</span>
            <span class="soften-text">Amasar<br><small>−60</small></span>
          </button>
        </aside>
      </div>

      <!-- Aviso de peligro -->
      <div id="danger-banner" hidden>⚠ ¡Cuidado! El tarro está lleno</div>

      <!-- Superposiciones (inicio / pausa / fin) -->
      <div id="overlay" hidden></div>
    </main>

  </div>

  <script src="vendor/matter.min.js"></script>
  <script type="module" src="js/main.js?v=14"></script>
</body>
</html>
